[package]
name = "myactuator-rmd-can"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "SLCAN transport and CLI for MyActuator RMD-X actuators via USB-CAN"

[lib]
name = "myactuator_rmd_can"

[[bin]]
name = "myactuator-rmd-cli"
path = "src/main.rs"

[dependencies]
myactuator-rmd = { path = "../myactuator-rmd" }
clap = { version = "4", features = ["derive"] }
serialport = "4"
thiserror = "2"

[lints]
workspace = true
